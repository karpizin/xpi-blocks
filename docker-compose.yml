services:
  xpi-blocks:
    image: ghcr.io/karpizin/xpi-blocks:latest
    container_name: xpi-blocks-container
    # Host networking: ROS 2 (DDS) discovery with nodes and tools (rviz, rqt) on the LAN.
    network_mode: host
    # Pass through only the devices your robot uses, not privileged mode and all of /dev.
    # Docker refuses to start if a listed device does not exist: enable the interface
    # (sudo raspi-config -> Interface Options) or comment the line out.
    # See docs/DEPLOYMENT_DOCKER.md for which block needs which device.
    devices:
      - /dev/i2c-1          # I2C sensors, PCA9685, displays
      - /dev/gpiomem        # GPIO: motors, relays, buttons (gpiozero's native pin factory, Pi 4 and older)
      # - /dev/spidev0.0    # SPI: MAX7219 LED matrix, PMW3901, W25Qxx, LoRa
      # - /dev/ttyAMA0      # UART: SBUS/CRSF receivers, LiDARs, PMS5003, HC-12
      # - /dev/ttyUSB0      # USB-serial adapters
      # - /dev/ttyACM0      # USB CDC devices (Meshtastic, some GPS)
      # - /dev/snd          # audio blocks
      # - /dev/video0       # cameras
    # WS2812 (rpi_ws281x) drives the LEDs through /dev/mem, which is full access to the
    # host's memory. Only if you use that block:
    #   devices: [/dev/mem]
    #   cap_add: [SYS_RAWIO]
    environment:
      - ROS_DOMAIN_ID=0
    stdin_open: true
    tty: true
    restart: unless-stopped
