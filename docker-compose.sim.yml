services:
  xpi_sim:
    image: xpi-blocks
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xpi_sim
    # Simulation needs no hardware: run nodes with mock_hardware:=true.
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_LOCALHOST_ONLY=1   # topics stay on this machine
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # GPU acceleration for Gazebo/RViz (Intel/AMD), if the host has it:
    # devices:
    #   - /dev/dri
    stdin_open: true
    tty: true
    command: /bin/bash
